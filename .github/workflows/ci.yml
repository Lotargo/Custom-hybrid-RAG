name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - { cxx: "g++-13", c: "gcc-13", name: "GCC 13" }
          - { cxx: "clang++-17", c: "clang-17", name: "Clang 17" }
        sanitizers: [ "OFF", "ON" ]
        build_type: [ "Release" ]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-13 clang-17

    - name: Setup vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_cache
          ${{ github.workspace }}/build/vcpkg_installed
        key: ${{ runner.os }}-${{ matrix.compiler.name }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler.name }}-vcpkg-

    - name: Cache Intel SDE
      id: cache-sde
      uses: actions/cache@v4
      with:
        path: /tmp/sde
        key: ${{ runner.os }}-intel-sde-9.33.0-2024-01-07

    - name: Download Intel SDE
      if: steps.cache-sde.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/sde && cd /tmp/sde
        wget -qO sde.tar.xz https://downloadmirror.intel.com/813591/sde-external-9.33.0-2024-01-07-lin.tar.xz
        tar -xf sde.tar.xz --strip-components=1

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg

    - name: Configure CMake
      env:
        CXX: ${{ matrix.compiler.cxx }}
        CC: ${{ matrix.compiler.c }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      run: >
        mkdir -p ${{ github.workspace }}/vcpkg_cache &&
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DRAG_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: /tmp/sde/sde64 -skx -- ./tests/sonatadb_tests
