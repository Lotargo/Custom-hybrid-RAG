name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - { cxx: "g++-13", c: "gcc-13", name: "GCC 13" }
          - { cxx: "clang++-17", c: "clang-17", name: "Clang 17" }
        sanitizers: [ "OFF", "ON" ]
        build_type: [ "Release" ]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-13 clang-17

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgGitCommitId: 4b3e4c276b5b87a649e66341e11553e8c577459c

    - name: Configure CMake
      env:
        CXX: ${{ matrix.compiler.cxx }}
        CC: ${{ matrix.compiler.c }}
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DRAG_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
