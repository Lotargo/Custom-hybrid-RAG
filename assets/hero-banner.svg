<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Dynamic Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </radialGradient>
    <filter id="blurBlock">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" />
    </filter>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="400" fill="url(#grad1)" />
  <rect width="1200" height="400" fill="url(#glow)" />

  <!-- Abstract Tech Grid/Nodes (HNSW Vibe) -->
  <g stroke="#30363d" stroke-width="1" opacity="0.5">
    <circle cx="200" cy="100" r="2" fill="#58a6ff" />
    <circle cx="400" cy="300" r="2" fill="#58a6ff" />
    <circle cx="800" cy="150" r="2" fill="#bc8cff" />
    <circle cx="1000" cy="250" r="2" fill="#3fb950" />
    <line x1="200" y1="100" x2="400" y2="300" />
    <line x1="400" y1="300" x2="800" y2="150" />
    <line x1="800" y1="150" x2="1000" y2="250" />
    <line x1="200" y1="100" x2="800" y2="150" />
  </g>

  <!-- Text Section -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" font-size="60" fill="#ffffff">
    Custom Hybrid RAG
  </text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" letter-spacing="2">
    C++23 • ZERO-ALLOCATION • HARDWARE-LEVEL SLA
  </text>

  <!-- Accent Line -->
  <rect x="450" y="260" width="300" height="4" rx="2" fill="#58a6ff" opacity="0.8" />
</svg>
